<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Reservas{% endblock %}</title>
    <style>
        :root {
            --bg: #f6f6f2;
            --text: #1f1f1f;
            --card: #ffffff;
            --accent: #2f6f6d;
        }

        body {
            margin: 0;
            font-family: "Georgia", "Times New Roman", serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            padding: 20px 16px;
            background: var(--card);
            border-bottom: 2px solid #e0e0e0;
        }

        nav {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        nav a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        main {
            padding: 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid #e4e4e4;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            background: var(--accent);
            color: #ffffff;
            font-size: 12px;
        }

        @media (min-width: 768px) {
            main {
                max-width: 720px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>Salon Lash - Reservas</h1>
    <nav>
        <a href="{% url 'service_list' %}">Servicios</a>
        {% if user.is_authenticated %}
            <a href="{% url 'booking_list' %}">Mis reservas</a>
            {% if user.is_staff %}
                <a href="{% url 'admin_booking_list' %}">Admin reservas</a>
            {% endif %}
            <a href="{% url 'logout' %}">Salir</a>
        {% else %}
            <a href="{% url 'login' %}">Entrar</a>
        {% endif %}
    </nav>
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
