{% extends "base.html" %}

{% block title %}Eliminar horario{% endblock %}

{% block content %}
    <h2 class="section-title">Eliminar horario</h2>
    <div class="card">
        <p>Vas a eliminar: <strong>{{ slot.date }} {{ slot.start_time }} - {{ slot.end_time }}</strong></p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Confirmar</button>
            <a class="btn btn--ghost" href="{% url 'slot_list' %}">Cancelar</a>
        </form>
    </div>
{% endblock %}
