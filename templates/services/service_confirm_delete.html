{% extends "base.html" %}

{% block title %}Eliminar servicio{% endblock %}

{% block content %}
    <h1 class="section-title">Eliminar servicio</h1>
    <div class="card">
        <p>Vas a eliminar: <strong>{{ service.name }}</strong></p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Confirmar</button>
            <a class="btn btn--ghost" href="{% url 'service_admin_list' %}">Cancelar</a>
        </form>
    </div>
{% endblock %}
