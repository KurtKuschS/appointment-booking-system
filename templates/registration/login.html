{% extends "base.html" %}

{% block title %}Ingresar{% endblock %}

{% block content %}
    <h2>Ingresar</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        <div class="card">
            <label>Usuario</label><br />
            {{ form.username }}
        </div>

        <div class="card">
            <label>Contrasena</label><br />
            {{ form.password }}
        </div>

        <button type="submit">Entrar</button>
    </form>
{% endblock %}
